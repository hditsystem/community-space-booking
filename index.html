<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clickable pilot prototype for Calgary community space booking." />
    <title>Gather — Community spaces, made simple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <button class="brand" data-route="home" aria-label="Gather home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>gather</span>
        </button>
        <nav class="main-nav" aria-label="Primary navigation">
          <button data-route="explore">Find a space</button>
          <button data-route="host">For community spaces</button>
          <button data-route="dashboard">Volunteer dashboard</button>
        </nav>
        <div class="header-actions">
          <button class="text-button" data-route="dashboard">Sign in</button>
          <button class="button button-dark button-small" data-route="host">List your space</button>
        </div>
        <button class="mobile-menu" aria-label="Open menu" aria-expanded="false">☰</button>
      </header>

      <main id="app" tabindex="-1"></main>

      <footer class="site-footer">
        <div>
          <div class="brand footer-brand"><span class="brand-mark"><span></span><span></span><span></span></span><span>gather</span></div>
          <p>Community space booking without the phone tag.</p>
        </div>
        <div class="footer-links"><button data-route="explore">Browse spaces</button><button data-route="host">List a venue</button><button data-route="dashboard">Pilot dashboard</button></div>
        <p class="pilot-note">Pilot concept · Calgary, Alberta</p>
      </footer>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
